[package]
name = "otzar-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
rmcp = { version = "3.8.0", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "sync", "time"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
